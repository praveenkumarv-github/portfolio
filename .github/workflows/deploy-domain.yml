name: Phase 2 - Deploy Cloudflare and Domain

on:
  workflow_dispatch:
    inputs:
      zappa_stage:
        description: "Zappa stage"
        required: true
        default: "production"

permissions:
  id-token: write
  contents: read

concurrency:
  group: finance-dash-production-deploy
  cancel-in-progress: false

jobs:
  deploy-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true
      ZAPPA_STAGE: ${{ github.event.inputs.zappa_stage }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          for name in DOMAIN_NAME CLOUDFLARE_ZONE_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Required Phase 2 setting $name is missing"
              exit 1
            fi
          done

      - name: Initialize Terraform states
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra/domain init

      - name: Publish ACM validation records to Cloudflare
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          terraform -chdir=infra output -json acm_validation_records > /tmp/acm-validation-records.json
          while IFS=$'\t' read -r type name value; do
            python scripts/cloudflare_dns.py upsert \
              --zone-id "$CLOUDFLARE_ZONE_ID" \
              --type "$type" \
              --name "$name" \
              --content "$value" \
              --proxied false
          done < <(jq -r '.[] | [.type, .name, .value] | @tsv' /tmp/acm-validation-records.json)

      - name: Discover Zappa API Gateway ID
        id: apigw
        run: |
          API_ID=$(aws cloudformation describe-stack-resources \
            --stack-name "portfolio-$ZAPPA_STAGE" \
            --query "StackResources[?ResourceType=='AWS::ApiGateway::RestApi'].PhysicalResourceId | [0]" \
            --output text)
          if [[ ! "$API_ID" =~ ^[a-z0-9]{10,}$ ]]; then
            echo "Could not find a valid REST API ID in the portfolio-$ZAPPA_STAGE stack"
            exit 1
          fi
          echo "api_id=$API_ID" >> "$GITHUB_OUTPUT"

      - name: Terraform Phase 2 (custom domain mapping)
        run: |
          ACM_CERTIFICATE_ARN=$(terraform -chdir=infra output -raw acm_certificate_arn)
          terraform -chdir=infra/domain apply -auto-approve \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            -var="subdomain=${{ vars.SUBDOMAIN || 'finance' }}" \
            -var="project=${{ vars.PROJECT_NAME || 'finance-dash' }}" \
            -var="environment=${{ vars.ENVIRONMENT || 'prod' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="acm_certificate_arn=$ACM_CERTIFICATE_ARN" \
            -var="zappa_api_gateway_id=${{ steps.apigw.outputs.api_id }}" \
            -var="zappa_stage_name=$ZAPPA_STAGE"

      - name: Publish proxied dashboard CNAME to Cloudflare
        run: |
          API_GATEWAY_DOMAIN=$(terraform -chdir=infra/domain output -raw regional_domain_name)
          python scripts/cloudflare_dns.py upsert \
            --zone-id "$CLOUDFLARE_ZONE_ID" \
            --type CNAME \
            --name "${{ vars.SUBDOMAIN || 'finance' }}.${{ vars.DOMAIN_NAME }}" \
            --content "$API_GATEWAY_DOMAIN" \
            --proxied true