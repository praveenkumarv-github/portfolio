name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize without backend
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra/domain init -backend=false -input=false
      - name: Validate and format
        run: |
          terraform -chdir=infra validate
          terraform -chdir=infra/domain validate
          terraform -chdir=infra fmt -check -recursive

  lambda-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Amazon Linux compatible wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip download \
            --dest /tmp/lambda-wheels \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            -r requirements-lambda-native.txt

  terraform-floci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        env:
          FLOCI_DEFAULT_REGION: ap-south-1
          FLOCI_STORAGE_MODE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Apply infra/ against Floci
        run: |
          chmod +x scripts/floci_terraform_check.sh
          scripts/floci_terraform_check.sh