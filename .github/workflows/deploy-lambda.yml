name: Phase 1 - Deploy Infrastructure and Lambda

on:
  workflow_dispatch:
    inputs:
      zappa_stage:
        description: "Zappa stage"
        required: true
        default: "production"

permissions:
  id-token: write
  contents: read

concurrency:
  group: finance-dash-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true
      ZAPPA_STAGE: ${{ github.event.inputs.zappa_stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install deploy dependencies (Native Amazon Linux Binaries)
        run: |
          python -m venv venv
          echo "VIRTUAL_ENV=$(pwd)/venv" >> $GITHUB_ENV
          echo "$(pwd)/venv/bin" >> $GITHUB_PATH
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          
          pip install -r requirements-deploy.txt  
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --target ./venv/lib/python3.11/site-packages \
            --only-binary=:all: \
            --upgrade \
            -r requirements-lambda-native.txt

      - name: Terraform Phase 1 (base infrastructure)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            -var="subdomain=${{ vars.SUBDOMAIN || 'finance' }}" \
            -var="project=${{ vars.PROJECT_NAME || 'finance-dash' }}" \
            -var="environment=${{ vars.ENVIRONMENT || 'prod' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="enable_github_oidc_role=true" \
            -var="github_owner=praveenkumarv-github" \
            -var="github_repo=portfolio" \
            -var="github_branch=${{ vars.DEPLOY_BRANCH || 'fea-v2' }}"

      - name: Capture Terraform outputs
        id: tf
        working-directory: infra
        run: |
          echo "role_arn=$(terraform output -raw lambda_role_arn)" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$(terraform output -raw s3_bucket)" >> "$GITHUB_OUTPUT"

      - name: Patch zappa settings for CI package + layers
        run: |
          source venv/bin/activate
          python scripts/patch_zappa_settings.py
        env:
          TF_ROLE_ARN: ${{ steps.tf.outputs.role_arn }}
          TF_S3_BUCKET: ${{ steps.tf.outputs.s3_bucket }}
          LAMBDA_LAYER_ARNS: ${{ vars.LAMBDA_LAYER_ARNS }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          GOOGLE_SERVICE_ACCOUNT_SECRET_ID: ${{ vars.GOOGLE_SERVICE_ACCOUNT_SECRET_ID || 'finance-dash/google-service-account' }}
          CLOUDFLARE_ACCESS_ENABLED: ${{ vars.CLOUDFLARE_ACCESS_ENABLED }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_ACCESS_AUDIENCE: ${{ secrets.CLOUDFLARE_ACCESS_AUDIENCE }}
          CLOUDFLARE_ACCESS_ALLOWED_EMAIL: ${{ secrets.CLOUDFLARE_ACCESS_ALLOWED_EMAIL }}

      - name: Upsert Google service account secret in Secrets Manager
        if: env.GOOGLE_SA_JSON != ''
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          source venv/bin/activate
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${{ vars.PROJECT_NAME || 'finance-dash' }}/google-service-account" \
            --secret-string "$GOOGLE_SA_JSON"

      - name: Clean Zappa cache before packaging
        run: |
          rm -rf .zappa* .zappa_settings_cache pip-cache
          echo "✅ Cleared old Zappa cache"

      - name: Deploy or update with Zappa
        run: |
          source venv/bin/activate
          set -e
          
          if python -m zappa.cli status "$ZAPPA_STAGE" >/tmp/zappa_status.txt 2>&1; then
            echo '📦 Updating existing Lambda...'
            python -m zappa.cli update "$ZAPPA_STAGE"
          else
            echo '🚀 Deploying new Lambda...'
            python -m zappa.cli deploy "$ZAPPA_STAGE"
          fi

      - name: Get API Gateway ID from Zappa status
        run: |
          source venv/bin/activate
          
          python -m zappa.cli status "$ZAPPA_STAGE" | tee /tmp/zappa_status_live.txt
            
          URL=$(grep -Eo 'https://[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com/[a-zA-Z0-9_-]+' /tmp/zappa_status_live.txt | head -n1)
          if [ -z "$URL" ]; then
            echo "Could not find API Gateway URL from zappa status output"
            exit 1
          fi
          API_ID=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.execute-api\..*#\1#')
          if [[ ! "$API_ID" =~ ^[a-z0-9]{10,}$ ]]; then
            echo "Invalid API Gateway ID parsed from zappa status output"
            exit 1
          fi
          echo "Extracted API Gateway ID: $API_ID"
          echo "Run the Phase 2 workflow to publish Cloudflare DNS and the custom domain."

      - name: Fetch CloudWatch Logs on failure
        if: failure()
        run: |
          echo "Deployment failed. Fetching CloudWatch logs..."
          source venv/bin/activate
          python -m zappa.cli tail "$ZAPPA_STAGE" --since 10m || true