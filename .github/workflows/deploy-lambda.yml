name: Deploy Lambda App

on:
  workflow_dispatch:
    inputs:
      terraform_apply:
        description: "Run Terraform apply phases"
        required: true
        default: "true"
      zappa_stage:
        description: "Zappa stage"
        required: true
        default: "production"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: true
      ZAPPA_STAGE: ${{ github.event.inputs.zappa_stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install deploy dependencies (clean venv)
        run: |
          # Clean any stale venv
          rm -rf venv/
          
          # Create fresh virtual environment
          python -m venv venv
          
          # Export to $GITHUB_ENV so ALL future steps use this venv
          echo "VIRTUAL_ENV=$(pwd)/venv" >> $GITHUB_ENV
          echo "$(pwd)/venv/bin" >> $GITHUB_PATH
          
          # Upgrade pip/setuptools/wheel FIRST
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          
          # Install requirements (will respect venv)
          pip install -r requirements-deploy.txt

      - name: Terraform Phase 1 (base infra)
        if: ${{ github.event.inputs.terraform_apply == 'true' }}
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            -var="subdomain=${{ vars.SUBDOMAIN || 'finance' }}" \
            -var="project=${{ vars.PROJECT_NAME || 'finance-dash' }}" \
            -var="environment=${{ vars.ENVIRONMENT || 'prod' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="zappa_api_gateway_id=" \
            -var="enable_github_oidc_role=true" \
            -var="github_owner=praveenkumarv-github" \
            -var="github_repo=portfolio"

      - name: Capture Terraform outputs
        id: tf
        if: ${{ github.event.inputs.terraform_apply == 'true' }}
        working-directory: infra
        run: |
          echo "role_arn=$(terraform output -raw lambda_role_arn)" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$(terraform output -raw s3_bucket)" >> "$GITHUB_OUTPUT"

      - name: Patch zappa settings for CI package + layers
        run: |
          python - << 'PY'
          import json
          import os

          path = "zappa_settings.json"
          with open(path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          stage = os.environ.get("ZAPPA_STAGE", "production")
          prod = cfg[stage]

          prod["runtime"] = "python3.11"
          prod["slim_handler"] = True
          prod["use_precompiled_packages"] = True
          prod["ephemeral_storage"] = {"Size": 2048}
          
          # Ensure exclude array is comprehensive
          prod["exclude"] = [
              ".git",
              ".gitignore",
              ".env",
              "**/__pycache__",
              "**/*.pyc",
              "tests/**",
              "venv/**",
              ".pytest_cache/**",
              "*.md",
              "infra/**",
              ".terraform/**",
              "*.csv",
              "*.xlsx",
              "*.txt",
              "key.json",
              ".DS_Store",
              ".vscode/**",
              ".idea/**"
          ]

          role_arn = os.environ.get("TF_ROLE_ARN", "").strip()
          bucket = os.environ.get("TF_S3_BUCKET", "").strip()
          if role_arn:
              prod["role_arn"] = role_arn
          if bucket:
              prod["s3_bucket"] = bucket

          layer_arns_raw = os.environ.get("LAMBDA_LAYER_ARNS", "").strip()
          if layer_arns_raw:
              prod["lambda_layers"] = [x.strip() for x in layer_arns_raw.split(",") if x.strip()]

          envs = prod.setdefault("environment_variables", {})
          if os.environ.get("DJANGO_SECRET_KEY"):
              envs["DJANGO_SECRET_KEY"] = os.environ["DJANGO_SECRET_KEY"]
          if os.environ.get("ALLOWED_HOSTS"):
              envs["ALLOWED_HOSTS"] = os.environ["ALLOWED_HOSTS"]
          if os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON"):
              envs["GOOGLE_SERVICE_ACCOUNT_JSON"] = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          PY
        env:
          TF_ROLE_ARN: ${{ steps.tf.outputs.role_arn }}
          TF_S3_BUCKET: ${{ steps.tf.outputs.s3_bucket }}
          LAMBDA_LAYER_ARNS: ${{ vars.LAMBDA_LAYER_ARNS }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upsert Google service account secret in Secrets Manager
        if: env.GOOGLE_SA_JSON != ''
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${{ vars.PROJECT_NAME || 'finance-dash' }}/google-service-account" \
            --secret-string "$GOOGLE_SA_JSON"

      - name: Deploy or update with Zappa
        run: |
          set -e
          # Zappa MUST run in the venv we created
          source venv/bin/activate
          
          if python -m zappa.cli status "$ZAPPA_STAGE" >/tmp/zappa_status.txt 2>&1; then
            python -m zappa.cli update "$ZAPPA_STAGE"
          else
            python -m zappa.cli deploy "$ZAPPA_STAGE"
          fi

      - name: Get API Gateway ID from Zappa status
        id: apigw
        run: |
          source venv/bin/activate
          python -m zappa.cli status "$ZAPPA_STAGE" | tee /tmp/zappa_status_live.txt
          URL=$(grep -Eo 'https://[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com/[a-zA-Z0-9_-]+' /tmp/zappa_status_live.txt | head -n1)
          if [ -z "$URL" ]; then
            echo "Could not find API Gateway URL from zappa status output"
            exit 1
          fi
          API_ID=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.execute-api\..*#\1#')
          echo "api_id=$API_ID" >> "$GITHUB_OUTPUT"

      - name: Terraform Phase 2 (custom domain mapping)
        if: ${{ github.event.inputs.terraform_apply == 'true' }}
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            -var="subdomain=${{ vars.SUBDOMAIN || 'finance' }}" \
            -var="project=${{ vars.PROJECT_NAME || 'finance-dash' }}" \
            -var="environment=${{ vars.ENVIRONMENT || 'prod' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="zappa_api_gateway_id=${{ steps.apigw.outputs.api_id }}" \
            -var="zappa_stage_name=${{ env.ZAPPA_STAGE }}" \
            -var="enable_github_oidc_role=true" \
            -var="github_owner=praveenkumarv-github" \
            -var="github_repo=portfolio"

      - name: Fetch CloudWatch Logs on failure
        if: failure()
        run: |
          echo "Deployment failed. Fetching CloudWatch logs..."
          source venv/bin/activate
          python -m zappa.cli tail "$ZAPPA_STAGE" --since 10m || true